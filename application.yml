server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: pawconnect-backend
  datasource:
    # Aiven PostgreSQL. Format: jdbc:postgresql://<host>:<port>/defaultdb?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

# Supabase is used for login only. Application data lives in the database above.
supabase:
  url: ${SUPABASE_URL:}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}          # legacy HS256 projects only; leave blank for asymmetric-key projects
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}   # server-only; signs links to verification documents

pawconnect:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

app:
  call:
    room-secret: ${CALL_ROOM_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
